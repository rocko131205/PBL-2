name: security

# Stage 1 of the delivery pipeline: ci-cd.yml calls this on every push and PR, so
# these gates must pass before an image is built or deployed (see docs/CI_CD.md).
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # weekly: catch newly published CVEs in unchanged dependencies

permissions:
  contents: read

jobs:
  tests:
    name: Unit + security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  sast:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "bandit>=1.7"
      # Fail the build on medium+ severity, medium+ confidence findings.
      - run: bandit -r finveritas app.py scripts -ll -ii

  dependencies:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "pip-audit>=2.7"
      - run: pip-audit -r requirements.txt --progress-spinner off

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
