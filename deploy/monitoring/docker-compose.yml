# FinVeritas monitoring: the app, Prometheus (collects its metrics) and Grafana (dashboard).
# Start it from the repo root, then open the dashboard at http://localhost:3000:
#
#   docker compose -f deploy/monitoring/docker-compose.yml up -d --build
#
# App: http://localhost:8501 · Prometheus: http://localhost:9090 · Grafana: http://localhost:3000
services:
  app:
    build: ../..                  # the repo's Dockerfile; /metrics is on port 9464 inside the network
    ports:
      - "127.0.0.1:8501:8501"

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # view the dashboard without logging in (local demo)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/finveritas.json
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/finveritas.json:/var/lib/grafana/dashboards/finveritas.json:ro
    ports:
      - "127.0.0.1:3000:3000"
