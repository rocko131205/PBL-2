# FinVeritas inventory — the servers site.yml configures.
#
# Replace the example address (203.0.113.10 is a documentation-only IP) with your
# server's public IP or DNS name. Ansible connects over SSH as a sudo-capable user
# with key-based auth — on Ubuntu 24.04 cloud images that user is "ubuntu".

[staging]
# finveritas-staging-1  ansible_host=203.0.113.20

[production]
finveritas-prod-1  ansible_host=203.0.113.10

# Every FinVeritas server, whatever the environment — group_vars/finveritas/ applies here.
[finveritas:children]
staging
production

[finveritas:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
