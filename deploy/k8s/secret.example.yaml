# Template only — NOT applied by kustomize, so real secrets never live in git.
# Easiest: create the Secret straight from your .env file:
#
#   kubectl -n finveritas create secret generic finveritas-secrets --from-env-file=.env
#
# Or copy this file outside the repo, fill it in, and `kubectl apply -f` it.
apiVersion: v1
kind: Secret
metadata:
  name: finveritas-secrets
  namespace: finveritas
type: Opaque
stringData:
  JWT_SECRET: ""            # REQUIRED, >= 32 random chars
  MONGO_URI: ""             # REQUIRED, e.g. mongodb+srv://<user>:<password>@<cluster>/
  FIELD_ENCRYPTION_KEY: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  LLM_API_KEY: ""
  NEWSAPI_KEY: ""
  FMP_API_KEY: ""
