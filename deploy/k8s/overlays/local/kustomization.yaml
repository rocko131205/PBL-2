# Local cluster (Docker Desktop Kubernetes, kind, minikube) using images built on this machine:
#   docker build --build-arg APP_VERSION=1.0.0 -t finveritas:1.0.0 .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: finveritas
    newTag: 1.0.0
